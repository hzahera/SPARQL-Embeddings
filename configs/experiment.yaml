project_name: result-aware-transformers
output_dir: results

# Point these at the fresh leakage-free splits.
datasets:
  dbpedia:
    train: datasets/dbpedia-splits/dbpedia-train.json
    valid: datasets/dbpedia-splits/dbpedia-valid.json
    test: datasets/dbpedia-splits/dbpedia-test.json
  wikidata:
    train: datasets/wikidata-splits/wikidata-train.json
    valid: datasets/wikidata-splits/wikidata-valid.json
    test: datasets/wikidata-splits/wikidata-test.json

training:
  epochs: 20
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  temperature: 0.05        # scale = 1 / temperature = 20, matching V30
  explicit_negatives: 4
  hard_fraction: 0.75
  hard_top_k: 8
  mining_start_epoch: 2    # epoch 1 is random; mine before epoch 2
  mining_refresh_every: 2
  eval_every_epochs: 1
  selection_metric: ranking.ndcg@10
  num_workers: 0
  amp: bf16                # bf16, fp16, or none
  gradient_checkpointing: true

# Evaluation is performed on the candidate list attached to each held-out anchor.
# The exact same anchor/candidate universe is used for zero-shot and tuned models.
evaluation:
  ks: [1, 3, 5, 10, 20]
  relevance_threshold: 0.8
  relevance_operator: ge   # >= 0.8; intentionally matches dataset construction
  ndcg_gain: linear        # use answer-set Jaccard directly as graded relevance
  macro_average: true
  encode_batch_size: 64
  alignment_pairs: all     # all stored anchor-candidate pairs in the split

semantic_cache:
  enabled: true

  cosine_threshold: 0.8
  positive_jaccard_min: 0.8
  negative_jaccard_max: 0.1

  primary_capacity: 128
  capacities: [32, 64, 128, 256]

  stream_seeds: [100, 101, 102, 103, 104]
  shuffle_streams: true

  encode_batch_size: 64

  include_exact_match_baseline: true
  include_oracle_baseline: true

  rq3_test_files:
    dbpedia: datasets/dbpedia-splits/dbpedia-test-rq3.json
    wikidata: datasets/wikidata-splits/wikidata-test-rq3.json

  run_threshold_sensitivity: false
  
seeds: [42, 43, 44, 45, 46]
