[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "result-aware-transformers"
version = "0.1.0"
description = "Model-agnostic dynamic-hard-negative fine-tuning and evaluation for result-aware SPARQL embeddings."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.51",
  "accelerate>=1.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "pandas>=2.2",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
